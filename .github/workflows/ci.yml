name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python src/audit.py
      - run: python -m unittest discover -s test -v
      - run: python -m compileall -q src
      - run: python src/compare.py --base-zero results/base-zero.jsonl --base-few results/base-few.jsonl --lora-base results/lora-base.jsonl --lora-augmented results/lora-augmented.jsonl
